<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password · Korvus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;--ink:#f6f8ff;--ink-dim:#aab0c0;--ink-faint:#646b7d;
    --line-bright:rgba(255,255,255,.18);--crimson:#ff2d8f;--crimson-bright:#ff5ba8;
    --crimson-glow:rgba(255,45,143,.55);--up:#3ce594;--gold-deep:#d6146e;
    --mono:'IBM Plex Mono',monospace;--body:'Hanken Grotesk',system-ui,sans-serif;--disp:'Bricolage Grotesque',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;overflow-x:hidden;}
  .glow{position:fixed;top:-22vh;left:50%;transform:translateX(-50%);width:90vw;height:60vh;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(255,45,143,.13),rgba(255,45,143,.04) 42%,transparent 72%);filter:blur(30px);}
  .card{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(14,17,22,.6);backdrop-filter:blur(14px);
    border:1px solid var(--line-bright);border-radius:18px;padding:32px 30px;box-shadow:0 30px 80px -34px #000;}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;}
  .crown{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 25%,#1a1012,#070405);border:1px solid rgba(255,45,143,.42);box-shadow:0 0 22px -6px var(--crimson);}
  .brand-name{font-family:var(--disp);font-weight:600;font-size:22px;}
  h1{font-family:var(--disp);font-weight:500;font-size:25px;margin-bottom:8px;}
  .desc{color:var(--ink-dim);font-size:14px;line-height:1.55;margin-bottom:22px;}
  label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px 2px;}
  input{width:100%;background:#0a0d12;border:1px solid var(--line-bright);border-radius:10px;color:var(--ink);
    font-family:var(--body);font-size:14.5px;padding:12px 13px;margin-bottom:16px;transition:border-color .2s;}
  input:focus{outline:none;border-color:var(--crimson);}
  .btn{width:100%;background:var(--crimson);color:#0a0d12;font-weight:700;font-size:15px;padding:13px;border:none;border-radius:11px;
    cursor:pointer;font-family:var(--body);transition:background .2s,transform .15s;box-shadow:0 0 22px -6px var(--crimson-glow);}
  .btn:hover:not(:disabled){background:var(--crimson-bright);transform:translateY(-1px);}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}
  .msg{font-family:var(--mono);font-size:12px;margin-top:14px;min-height:16px;line-height:1.5;}
  .msg.ok{color:#9fe9bd;} .msg.err{color:#ffb3af;}
  .alt{margin-top:18px;font-size:13px;color:var(--ink-dim);text-align:center;}
  .alt a{color:var(--gold-deep);text-decoration:none;}
  .chartscape{position:fixed;inset:0;z-index:-3;width:100%;height:100%;overflow:hidden;pointer-events:none;opacity:.85;will-change:transform;backface-visibility:hidden;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMEEwQTBEIi8+CjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDExLDE1KSBzY2FsZSgxLjE2KSI+CjxwYXRoIGQ9Ik00IDI0IEw0IDkgTDEyIDE2IEwxOCA1IEwyNCAxNiBMMzIgOSBMMzIgMjQgWiIgZmlsbD0iI0ZGMkQ5NSIvPgo8cmVjdCB4PSI1IiB5PSIyNiIgd2lkdGg9IjI2IiBoZWlnaHQ9IjMiIGZpbGw9IiNGRjJEOTUiLz4KPC9nPgo8L3N2Zz4=">
</head>
<body>
<canvas id="chartscape" class="chartscape"></canvas>
  <div class="glow"></div>
  <div class="card">
    <div class="brand">
      <span class="crown">
        <svg viewBox="0 0 36 33" width="20" height="20" fill="none" stroke="#ff2d8f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><path d="M4 24 L4 9 L12 16 L18 5 L24 16 L32 9 L32 24 Z"/><path d="M8 28 L28 28"/></svg>
      </span>
      <span class="brand-name">Korvus</span>
    </div>
    <h1>Reset your password</h1>
    <p class="desc">Enter the email on your account and we'll send a link to set a new password.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    <button class="btn" id="send">Send reset link</button>
    <div class="msg" id="msg"></div>
    <p class="alt">Remembered it? <a href="/login">Back to log in</a></p>
  </div>
<script>
const btn = document.getElementById('send');
function msg(kind, text){ const e=document.getElementById('msg'); e.className='msg '+kind; e.textContent=text; }
btn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if(!email){ msg('err','Please enter your email.'); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending\u2026';
  try{
    const res = await fetch('/api/forgot', {method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify({email})});
    const data = await res.json().catch(()=>({}));
    msg('ok', data.message || 'If an account exists for that email, a reset link is on its way.');
  }catch(e){ msg('err','Network error, please try again.'); }
  btn.disabled = false; btn.textContent = label;
});
document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') btn.click(); });
</script>
<script>
(function(){
  var cv=document.getElementById('chartscape');
  if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var CW=16, GAP=5, SLOT=CW+GAP, SPEED=0.35, BUF=SLOT*3;
  var W=0,H=0,CWID=0, candles=[], shift=0, trend=0.5, tvel=0;
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function theme(){
    var light=document.documentElement.getAttribute('data-theme')==='light';
    return light
      ? {bull:'#0e0b16', bear:'#c9146a', body:0.88}
      : {bull:'#f4f6ff', bear:'#ff2d8f', body:0.95};
  }
  function nextC(prev){
    tvel+=(Math.random()-0.5)*0.02; tvel*=0.9; trend+=tvel;
    trend=Math.max(0.22,Math.min(0.78,trend));
    var o=prev?prev.c:trend;
    var c=o+(trend-o)*0.32+(Math.random()-0.5)*0.24;
    c=Math.max(0.06,Math.min(0.95,c));
    return {o:o,c:c,h:Math.max(o,c)+Math.random()*0.06,l:Math.min(o,c)-Math.random()*0.06};
  }
  function fill(){ var need=Math.ceil(CWID/SLOT)+3; while(candles.length<need) candles.push(nextC(candles[candles.length-1])); }
  // draw every candle once, crisp, at whole-pixel positions (re-run only when the strip shifts one slot)
  function render(){
    var t=theme(); ctx.clearRect(0,0,CWID,H);
    var surface=Math.round(H*0.80), top=H*0.20, bot=surface;
    function yy(l){ return Math.round(bot-(bot-top)*Math.max(0,Math.min(1.05,l))); }
    for(var i=0;i<candles.length;i++){
      var x=i*SLOT; if(x>CWID+CW) break;
      var cd=candles[i], up=cd.c>=cd.o, col=up?t.bull:t.bear;
      var yt=yy(Math.max(cd.o,cd.c)), yb=yy(Math.min(cd.o,cd.c)), h=Math.max(2,yb-yt);
      var yh=yy(cd.h), yl=yy(cd.l), cx=x+CW/2;
      ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2; ctx.globalAlpha=t.body;
      ctx.beginPath(); ctx.moveTo(cx,yh); ctx.lineTo(cx,yl); ctx.stroke();
      ctx.fillRect(x,yt,CW,h);
    }
    ctx.globalAlpha=1;
  }
  function place(){ cv.style.transform='translate3d('+(-(BUF+shift))+'px,0,0)'; }
  function resize(){
    W=window.innerWidth; H=window.innerHeight; CWID=W+BUF*2;
    cv.width=CWID*dpr; cv.height=H*dpr;
    cv.style.width=CWID+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fill(); render(); place();
  }
  // glide the whole crisp strip with a GPU transform: smooth, sub-pixel, never re-rasterized
  function tick(){
    shift+=SPEED;
    if(shift>=SLOT){ shift-=SLOT; candles.shift(); candles.push(nextC(candles[candles.length-1])); render(); }
    place();
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize',resize);
  resize();
  if(!reduce){ requestAnimationFrame(tick); }
})();
</script>
</body>
</html>
